[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hfgs"
version = "1.0.0"
description = "Half-shifted Fourier inversion for finite-horizon Gerber-Shiu functionals"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/NoEdgeAtLife/hfgs"

[tool.setuptools]
packages = ["hfgs"]
